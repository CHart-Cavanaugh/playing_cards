<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <main id="playing-cards">
    <div class="card card-type-spade">
      <div class="left">
        <div class="card-icon-small">♠</div>
        <div class="card-value">3</div>
      </div>
      <div class="middle">
        <div class="icon-row icon-row-left">
          <div class="card-icon-small icon-disabled">♠</div>
          <div class="card-icon-small">♠</div>
          <div class="card-icon-small icon-disabled">♠</div>
        </div>
        <div class="icon-row icon-row-middle">
          <div class="card-icon-small icon-disabled">♠</div>
          <div class="card-icon-small">♠</div>
          <div class="card-icon-small icon-disabled">♠</div>
        </div>
        <div class="icon-row icon-row-right">
          <div class="card-icon-small icon-disabled">♠</div>
          <div class="card-icon-small">♠</div>
          <div class="card-icon-small icon-disabled">♠</div>
        </div>
      </div>
      <div class="right">
        <div class="card-icon-small">♠</div>
        <div class="card-value">3</div>
      </div>
    </div>
    <div class="card card-type-heart">
      <div class="left">
        <div class="card-icon-small">♥</div>
        <div class="card-value">7</div>
      </div>
      <div class="middle">
        <div class="icon-row icon-row-left">
          <div class="card-icon-small">♥</div>
          <div class="card-icon-small icon-disabled">♥</div>
          <div class="card-icon-small">♥</div>
        </div>
        <div class="icon-row icon-row-middle">
          <div class="card-icon-small">♥</div>
          <div class="card-icon-small">♥</div>
          <div class="card-icon-small">♥</div>
        </div>
        <div class="icon-row icon-row-right">
          <div class="card-icon-small">♥</div>
          <div class="card-icon-small icon-disabled">♥</div>
          <div class="card-icon-small">♥</div>
        </div>
      </div>
      <div class="right">
        <div class="card-icon-small">♥</div>
        <div class="card-value">7</div>
      </div>
    </div>
    <div class="card card-type-diamond">
      <div class="left">
        <div class="card-icon-small">♦</div>
        <div class="card-value">5</div>
      </div>
      <div class="middle">
        <div class="icon-row icon-row-left">
          <div class="card-icon-small">♦</div>
          <div class="card-icon-small icon-disabled">♦</div>
          <div class="card-icon-small">♦</div>
        </div>
        <div class="icon-row icon-row-middle">
          <div class="card-icon-small icon-disabled">♦</div>
          <div class="card-icon-small">♦</div>
          <div class="card-icon-small icon-disabled">♦</div>
        </div>
        <div class="icon-row icon-row-right">
          <div class="card-icon-small">♦</div>
          <div class="card-icon-small icon-disabled">♦</div>
          <div class="card-icon-small">♦</div>
        </div>
      </div>
      <div class="right">
        <div class="card-icon-small">♦</div>
        <div class="card-value">5</div>
      </div>
    </div>
  </main>
</body>

</html>
